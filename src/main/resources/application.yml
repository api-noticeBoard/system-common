# ===================================================================
# system-common 라이브러리 기본 설정 (Default Configuration)
# 이 라이브러리를 의존성으로 추가하는 애플리케이션(예: board-api)은
# 자신의 application.yml 파일에서 이 설정들을 오버라이드(override)하거나 추가할 수 있습니다.
# ===================================================================

# --- Spring 기본 설정 ---
spring:
  # 애플리케이션의 이름을 지정합니다.
  # Eureka, Spring Cloud Config 같은 서비스 디스커버리나 외부 설정 관리 도구에서 애플리케이션을 식별하는 ID로 사용됩니다.
  # 로그 패턴에도 이 이름을 포함시켜 어떤 애플리케이션의 로그인지 쉽게 구분할 수 있습니다.
  # **주의**: 이 라이브러리를 사용하는 최종 애플리케이션에서 반드시 자신의 프로젝트 이름으로 변경해야 합니다.
  # 수정 이유: 기본값을 플레이스홀더로 변경하여 오버라이드 강제. 라이브러리 이름으로 고정되면 혼란 발생.
  application:
    name: ${app.name:system-common}  # 플레이스홀더 사용: 최종 앱에서 app.name을 설정하도록 유도.

  # --- Redis 캐시 설정 ---
  # 이 라이브러리의 CacheConfig(@EnableCaching)가 동작하기 위해 필요한 Redis 서버 연결 정보입니다.
  # 최종 애플리케이션의 환경(로컬, 개발, 운영)에 맞게 이 값을 설정해야 합니다.
  data:
    redis:
      host: localhost # Redis 서버의 호스트 주소
      port: 6379      # Redis 서버의 포트 번호
      # password: your-redis-password # Redis에 비밀번호가 설정된 경우 주석을 해제하고 사용합니다.
    cache:
      type: redis

# --- 로깅(Logging) 설정 ---
logging:
  # 패키지별로 로그 레벨을 지정합니다.
  # 로그 레벨 순서: TRACE > DEBUG > INFO > WARN > ERROR
  # 특정 레벨로 설정하면, 그 레벨 이상의 로그만 출력됩니다. (예: INFO로 설정 시 INFO, WARN, ERROR 로그만 출력)
  level:
    # 우리가 만든 공통 라이브러리(system-common)의 로그는 DEBUG 레벨로 설정하여,
    # 개발 중에 AOP 로그 등 상세한 내부 동작을 확인할 수 있도록 합니다.
    com.portfolio.common: debug
    # Spring 프레임워크 자체의 로그는 INFO 레벨로 설정하여, 너무 과도한 로그가 출력되는 것을 방지합니다.
    # 수정 이유: Spring 캐시 관련 디버깅을 위해 org.springframework.cache를 DEBUG로 추가. 이전 INFO만으로는 캐시 초기화 로그 부족.
    org.springframework: info
    org.springframework.cache: debug  # 캐시 매니저 초기화 및 동작 로그를 자세히 보기 위해 추가.
    # (개발 시 유용한 추가 설정)
    # org.hibernate.SQL: debug  # JPA(Hibernate)가 실행하는 SQL 쿼리를 로그로 보고 싶을 때 사용합니다.
    # org.hibernate.type.descriptor.sql: trace # SQL의 '?'에 바인딩되는 파라미터 값까지 상세하게 보고 싶을 때 사용합니다.

  # 로그가 출력될 형식을 지정합니다.
  pattern:
    # 콘솔(Console)에 출력될 로그의 패턴입니다.
    # %d{yyyy-MM-dd HH:mm:ss.SSS} : 날짜 및 시간
    # [${spring.application.name:}] : 애플리케이션 이름 (설정되지 않은 경우 비어있음)
    # [%X{traceId:-}] : MDC에 저장된 traceId를 출력합니다. 없으면 '-'를 출력합니다. (TraceIdFilter와 연동)
    # [%t] : 현재 스레드의 이름
    # %-5level : 로그 레벨 (INFO, DEBUG 등). -5는 5칸의 공간을 확보하고 왼쪽 정렬합니다.
    # %logger{36} : 로거(클래스)의 이름. {36}은 최대 길이를 36으로 제한합니다.
    # - %msg%n : 실제 로그 메시지와 줄바꿈
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.application.name:}] [%X{traceId:-}] [%t] %-5level %logger{36} - %msg%n"

# --- Spring Boot Actuator 설정 (모니터링) ---
# Actuator는 애플리케이션의 상태를 모니터링하고 관리할 수 있는 HTTP 엔드포인트를 제공합니다.
# (예: /actuator/health 를 호출하여 애플리케이션이 정상 동작하는지 확인)
management:
  endpoints:
    web:
      exposure:
        # 보안을 위해 기본적으로는 health와 info 엔드포인트만 외부로 노출됩니다.
        # Prometheus 같은 모니터링 도구와 연동하기 위해 metrics, prometheus 엔드포인트를 추가로 노출합니다.
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      # /actuator/health 호출 시, DB 연결 상태 등 상세 정보를 보여줄지 결정합니다.
      # when_authorized: 인증된 사용자에게만 상세 정보 표시
      # always: 항상 상세 정보 표시 (보안에 유의)
      # never: 절대 상세 정보 표시 안 함
      show-details: when_authorized

# --- Resilience4j 설정 (외부 API 호출 안정성) ---
# HttpClient에서 사용된 @CircuitBreaker(name="external"), @Retry(name="external")에 대한
# 인스턴스별 상세 설정입니다. 여기서 설정한 값은 ResilienceConfig에 정의된 전역 기본 설정을 덮어씁니다(override).
# 수정 이유: 이전에는 주석 예시만 있어 기본값에 의존. 이제 external 인스턴스에 기본 오버라이드 적용 (failure-rate-threshold: 60, max-attempts: 5)으로 안정성 강화.
resilience4j:
  circuitbreaker:
    instances:
      # "external"이라는 이름의 서킷 브레이커 인스턴스에 대한 설정
      external:
        register-health-indicator: true # /actuator/health 엔드포인트에 이 서킷 브레이커의 상태(UP, DOWN 등)를 포함시킵니다.
        failure-rate-threshold: 60 # external API에 대해서는 실패율 60%를 기준으로 삼음. 이전 기본 50%보다 여유롭게 설정.
  retry:
    instances:
      # "external"이라는 이름의 재시도 인스턴스에 대한 설정
      external:
        max-attempts: 5 # external API에 대해서는 최대 5번 재시도. 이전 기본값(3)보다 증가시켜 안정성 높임.